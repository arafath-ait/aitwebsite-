    <!-- SECRET CODE -->
    <div class="secret-ait" onclick="checkVisitorCount()">AIT</div>

    <div class="container">
        <h1 id="main-title">🎬 AIT ടെക്സ്റ്റ് & ആനിമേഷൻ സ്റ്റുഡിയോ Pro</h1>
        
        <div class="studio-tabs">
            <button class="tab-btn active" id="tab-text" onclick="switchTab('text')">200 ടെക്സ്റ്റ് സ്റ്റൈലുകൾ</button>
            <button class="tab-btn" id="tab-anim" onclick="switchTab('anim')">🔥 ടെക്സ്റ്റ് ആനിമേഷൻ</button>
        </div>

        <input type="text" id="inputText" placeholder="ഇവിടെ ടൈപ്പ് ചെയ്യൂ...">

        <!-- 1. STATIC 200 STYLES -->
        <div id="text-section">
            <div class="controls">
                <select id="styleSelect" onchange="updateStyle()">
                    <!-- JavaScript വഴി 1 മുതൽ 200 വരെയുള്ള ഓപ്ഷനുകൾ എളുപ്പത്തിൽ താഴെ ലോഡ് ആകും -->
                </select>
                <button class="btn-download" onclick="downloadPNG()">📥 Transparent PNG</button>
            </div>
        </div>

        <!-- 2. ANIMATION STUDIO -->
        <div id="anim-section" style="display: none;">
            <div class="controls">
                <select id="animSelect" onchange="updateAnim()">
                    <option value="anim-fire">🔥 1. Fire Trail (തീ ഇഫക്റ്റ്)</option>
                    <option value="anim-neon">⚡ 2. RGB Neon Pulse</option>
                    <option value="anim-bounce">🏀 3. Pop Bounce</option>
                </select>
                <button class="btn-download" style="background: #00e676; color: black;" onclick="downloadPNG()">🎬 Save Frame PNG</button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="preview-area" id="previewBox">
            <div id="captureTarget" class="st-1">ഇവിടെ ടൈപ്പ് ചെയ്യൂ...</div>
        </div>
    </div>

    <script>
        let currentMode = 'text';

        // 1 മുതൽ 200 വരെയുള്ള ഓപ്ഷനുകൾ Dropdown-ലേക്ക് ഓട്ടോമാറ്റിക് ആയി ചേർക്കുന്ന കോഡ്
        const styleSelect = document.getElementById("styleSelect");
        for (let i = 1; i <= 200; i++) {
            let option = document.createElement("option");
            option.value = "st-" + i;
            option.innerText = "✨ Style " + i;
            styleSelect.appendChild(option);
        }

        function switchTab(mode) {
            currentMode = mode;
            if(mode === 'text') {
                document.getElementById('text-section').style.display = 'block';
                document.getElementById('anim-section').style.display = 'none';
                document.getElementById('tab-text').classList.add('active');
                document.getElementById('tab-anim').classList.remove('active');
                updateStyle();
            } else {
                document.getElementById('text-section').style.display = 'none';
                document.getElementById('anim-section').style.display = 'block';
                document.getElementById('tab-anim').classList.add('active');
                document.getElementById('tab-text').classList.remove('active');
                updateAnim();
            }
        }

        function updateStyle() {
            let input = document.getElementById("inputText").value.trim() || "ഇവിടെ ടൈപ്പ് ചെയ്യൂ...";
            let target = document.getElementById("captureTarget");
            target.className = document.getElementById("styleSelect").value;
            target.innerText = input;
        }

        function updateAnim() {
            let input = document.getElementById("inputText").value.trim() || "ഇവിടെ ടൈപ്പ് ചെയ്യൂ...";
            let target = document.getElementById("captureTarget");
            target.className = document.getElementById("animSelect").value;
            target.innerText = input;
        }

        document.getElementById("inputText").addEventListener("input", () => {
            if(currentMode === 'text') updateStyle();
            else updateAnim();
        });

        // Transparent PNG സേവ് ചെയ്യാനുള്ള ഫംഗ്ഷൻ (ക്ലിയർ ബാക്ക്ഗ്രൗണ്ട്)
        function downloadPNG() {
            let target = document.getElementById("captureTarget");
            let filename = document.getElementById("inputText").value.trim() || "ait_style";
            
            html2canvas(target, {
                backgroundColor: null,
                scale: 3
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = filename + '_transparent.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        function checkVisitorCount() {
            let code = prompt("ENTER SECRET CODE:");
            if (code === "AIT 2012") alert("📊 Welcome Admin!\nTotal Visitor Count: 1,850");
            else if(code !== null) alert("❌ Wrong Secret Code!");
        }

        function translateSite() {
            let lang = document.getElementById("langSelect").value;
            let title = document.getElementById("main-title");
            if(lang === 'ml') title.innerText = "🎬 AIT ടെക്സ്റ്റ് & ആനിമേഷൻ സ്റ്റുഡിയോ Pro";
            else title.innerText = "🎬 AIT Text & Animation Studio Pro";
        }
    </script>
</body>
</html>
