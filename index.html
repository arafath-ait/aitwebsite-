<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ടെക്സ്റ്റ് ആനിമേഷൻ വെബ്സൈറ്റ്</title>
    
    <!-- SEO META TAGS -->
    <meta name="description" content="AI ടെക്സ്റ്റ് ആനിമേഷൻ വെബ്സൈറ്റ് - 200+ Cool Text Styles, Minecraft Fonts, Animations & Transparent PNG Generator.">
    <meta name="keywords" content="AIT Text Studio, Minecraft Font Text, Transparent PNG Text Generator, Malayalam Fonts">
    <meta name="author" content="Arafath AIT">

    <!-- Google Fonts Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&family=Bangers&family=Russo+One&family=Creepster&family=Rubik+Glitch&family=Permanent+Marker&family=Lobster&family=Monoton&family=Luckiest+Guy&family=Cinzel:wght@700;900&family=VT323&family=Silkscreen&family=Pacifico&family=Righteous&family=Nosifer&family=Bungee+Spice&family=Nabla&family=Rubik+Burn&family=Shojumaru&family=Titan+One&family=Black+Ops+One&family=Fascinate+Inline&family=Oi&family=Amiri:wght@700&family=Special+Elite&family=Bungee+Shade&family=Kaushan+Script&family=Metal+Mania&family=Megrim&family=Frijole&family=UnifrakturMaguntia&family=Kumar+One+Outline&family=Sacramento&family=Comfortaa:wght@700&family=Platypi:wght@800&family=Syncopate:wght@700&family=Fredericka+the+Great&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a0a0e; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        .secret-ait { position: absolute; top: 15px; right: 20px; font-size: 13px; color: rgba(255, 255, 255, 0.4); cursor: pointer; font-family: monospace; z-index: 100; font-weight: bold; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .secret-ait:hover { color: #00f0ff; border-color: #00f0ff; }
        
        .lang-container { position: absolute; top: 12px; left: 20px; z-index: 100; display: flex; align-items: center; gap: 8px; }
        .lang-select { background: #181820; color: #fff; border: 1px solid #00f0ff; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; outline: none; }

        .container { background: #14141d; border-radius: 20px; padding: 25px; width: 100%; max-width: 900px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); text-align: center; border: 1px solid #2a2a3a; margin: 20px auto; }
        h1 { font-size: 26px; margin-bottom: 20px; color: #00f0ff; text-shadow: 0 0 15px rgba(0,240,255,0.5); font-family: 'Orbitron', sans-serif; }
        
        .studio-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 3px solid #00f0ff; padding-bottom: 8px; }
        .tab-btn { padding: 12px 25px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px 10px 0 0; background: #22222e; color: #bbb; transition: 0.3s; }
        .tab-btn.active { background: #00f0ff; color: #000; box-shadow: 0 -4px 15px rgba(0,240,255,0.4); }

        input[type="text"], select { width: 100%; background: #1c1c28; border: 2px solid #333344; border-radius: 10px; color: #fff; padding: 15px; font-size: 18px; text-align: center; outline: none; transition: 0.3s; }
        input[type="text"]::placeholder { color: #777; font-style: italic; }
        input[type="text"]:focus, select:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
        
        .controls { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin: 20px 0; }
        .btn-download { background: linear-gradient(45deg, #ff0055, #ff5500); color: #fff; border: none; font-size: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(255,0,85,0.4); }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,0,85,0.6); }

        .preview-area { background: #050508; border: 2px dashed #2a2a3a; border-radius: 15px; min-height: 280px; display: flex; justify-content: center; align-items: center; padding: 25px; margin-top: 15px; overflow: hidden; position: relative; }
        #captureTarget { padding: 20px; display: inline-block; word-break: break-all; text-align: center; max-width: 100%; position: relative; }

        /* ================= 200 VARIETY TEXT STYLES ================= */
        /* Style 1: MINECRAFT SPECIAL */
        .st-1 { font-family: 'Press Start 2P', monospace; font-size: 28px; color: #55FF55; text-shadow: 4px 4px 0px #000, -2px -2px 0px #375500; background: #222; padding: 10px 15px; border: 3px solid #55FF55; }
        
        .st-2 { font-family: 'Orbitron', sans-serif; font-size: 36px; color: #fff; text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 30px #00f0ff; }
        .st-3 { font-family: 'Russo One', sans-serif; font-size: 36px; color: #ffd700; text-shadow: 3px 3px 0px #b8860b, 6px 6px 0px #000; }
        .st-4 { font-family: 'Bangers', cursive; font-size: 42px; color: #ffeb3b; text-shadow: 4px 4px 0px #ff0055, 7px 7px 0px #000; }
        .st-5 { font-family: 'Rubik Glitch', cursive; font-size: 38px; color: #00ffff; text-shadow: -3px 0 #ff0055, 3px 0 #00ff00; }
        .st-6 { font-family: 'Creepster', cursive; font-size: 44px; color: #ff3333; text-shadow: 3px 3px 5px #000, 0 0 10px #8b0000; }
        .st-7 { font-family: 'Bungee Spice', sans-serif; font-size: 38px; }
        .st-8 { font-family: 'Nabla', cursive; font-size: 46px; }
        .st-9 { font-family: 'Rubik Burn', cursive; font-size: 38px; color: #ff3d00; text-shadow: 0 0 15px #ff3d00; }
        .st-10 { font-family: 'Nosifer', cursive; font-size: 32px; color: #ff0000; text-shadow: 0 0 10px #000; }
        .st-11 { font-family: 'Monoton', cursive; font-size: 40px; color: #e040fb; text-shadow: 0 0 10px #e040fb; }
        .st-12 { font-family: 'Cinzel', serif; font-size: 36px; color: #e5c158; text-shadow: 0 0 15px rgba(229,193,88,0.8); }
        .st-13 { font-family: 'VT323', monospace; font-size: 48px; color: #39ff14; text-shadow: 0 0 8px #39ff14; }
        .st-14 { font-family: 'Permanent Marker', cursive; font-size: 38px; color: #fcee21; text-shadow: 3px 3px 0px #ff0055; }
        .st-15 { font-family: 'Lobster', cursive; font-size: 38px; color: #ff4081; text-shadow: 2px 2px 0px #fff; }
        .st-16 { font-family: 'Luckiest Guy', cursive; font-size: 38px; color: #ff9800; text-shadow: 4px 4px 0px #3f51b5; }
        .st-17 { font-family: 'Pacifico', cursive; font-size: 36px; color: #00e676; text-shadow: 2px 2px 4px #000; }
        .st-18 { font-family: 'Righteous', cursive; font-size: 36px; color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .st-19 { font-family: 'Shojumaru', cursive; font-size: 34px; color: #ff1744; text-shadow: 2px 2px 0px #000; }
        .st-20 { font-family: 'Titan One', cursive; font-size: 38px; color: #00e5ff; text-shadow: 3px 3px 0px #002733; }

        /* 반복 വരുന്ന 200 ഡൈനാമിക് കളർ പാരറ്റേണുകൾ */
        .st-21, .st-41, .st-61, .st-81, .st-101, .st-121, .st-141, .st-161, .st-181 { font-family: 'Black Ops One', cursive; font-size: 36px; color: #76ff03; text-shadow: 3px 3px 0px #000; }
        .st-22, .st-42, .st-62, .st-82, .st-102, .st-122, .st-142, .st-162, .st-182 { font-family: 'Oi', cursive; font-size: 34px; color: #ffea00; text-shadow: 3px 3px 0px #d50000; }
        .st-23, .st-43, .st-63, .st-83, .st-103, .st-123, .st-143, .st-163, .st-183 { font-family: 'Silkscreen', sans-serif; font-size: 28px; color: #ff00ff; text-shadow: 2px 2px 0px #000; }
        .st-24, .st-44, .st-64, .st-84, .st-104, .st-124, .st-144, .st-164, .st-184 { font-family: 'Amiri', serif; font-size: 40px; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .st-25, .st-45, .st-65, .st-85, .st-105, .st-125, .st-145, .st-165, .st-185 { font-family: 'Special Elite', cursive; font-size: 32px; color: #d7ccc8; text-shadow: 2px 2px 0px #000; }
        .st-26, .st-46, .st-66, .st-86, .st-106, .st-126, .st-146, .st-166, .st-186 { font-family: 'Orbitron', sans-serif; font-size: 36px; color: #ff0055; text-shadow: 0 0 15px #ff0055; }
        .st-27, .st-47, .st-67, .st-87, .st-107, .st-127, .st-147, .st-167, .st-187 { font-family: 'Russo One', sans-serif; font-size: 36px; color: #00f0ff; text-shadow: 4px 4px 0px #000; }
        .st-28, .st-48, .st-68, .st-88, .st-108, .st-128, .st-148, .st-168, .st-188 { font-family: 'Bangers', cursive; font-size: 40px; color: #ffea00; text-shadow: 4px 4px 0px #ff0055; }
        .st-29, .st-49, .st-69, .st-89, .st-109, .st-129, .st-149, .st-169, .st-189 { font-family: 'Luckiest Guy', cursive; font-size: 38px; color: #39ff14; text-shadow: 3px 3px 0px #000; }
        .st-30, .st-50, .st-70, .st-90, .st-110, .st-130, .st-150, .st-170, .st-190 { font-family: 'Press Start 2P', monospace; font-size: 22px; color: #ff00ff; text-shadow: 3px 3px 0px #000; }

        .st-31, .st-51, .st-71, .st-91, .st-111, .st-131, .st-151, .st-171, .st-191 { font-family: 'Lobster', cursive; font-size: 38px; color: #ff9100; text-shadow: 2px 2px 0px #fff; }
        .st-32, .st-52, .st-72, .st-92, .st-112, .st-132, .st-152, .st-172, .st-192 { font-family: 'Righteous', cursive; font-size: 36px; color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
        .st-33, .st-53, .st-73, .st-93, .st-113, .st-133, .st-153, .st-173, .st-193 { font-family: 'Titan One', cursive; font-size: 38px; color: #ffd700; text-shadow: 3px 3px 0px #000; }
        .st-34, .st-54, .st-74, .st-94, .st-114, .st-134, .st-154, .st-174, .st-194 { font-family: 'Permanent Marker', cursive; font-size: 38px; color: #ff3d00; text-shadow: 2px 2px 0px #000; }
        .st-35, .st-55, .st-75, .st-95, .st-115, .st-135, .st-155, .st-175, .st-195 { font-family: 'Cinzel', serif; font-size: 36px; color: #ffffff; text-shadow: 0 0 15px #ffffff; }
        .st-36, .st-56, .st-76, .st-96, .st-116, .st-136, .st-156, .st-176, .st-196 { font-family: 'VT323', monospace; font-size: 46px; color: #00ff66; text-shadow: 0 0 10px #00ff66; }
        .st-37, .st-57, .st-77, .st-97, .st-117, .st-137, .st-157, .st-177, .st-197 { font-family: 'Rubik Glitch', cursive; font-size: 38px; color: #ff0055; }
        .st-38, .st-58, .st-78, .st-98, .st-118, .st-138, .st-158, .st-178, .st-198 { font-family: 'Creepster', cursive; font-size: 42px; color: #76ff03; }
        .st-39, .st-59, .st-79, .st-99, .st-119, .st-139, .st-159, .st-179, .st-199 { font-family: 'Monoton', cursive; font-size: 38px; color: #00e5ff; }
        .st-40, .st-60, .st-80, .st-100, .st-120, .st-140, .st-160, .st-180, .st-200 { font-family: 'Pacifico', cursive; font-size: 36px; color: #e040fb; }

        /* ================= ANIMATION EFFECTS ================= */
        .anim-fire { font-family: 'Rubik Burn', cursive; font-size: 40px; color: #ff3d00; text-shadow: 0 0 20px #ff3d00; animation: fireBurn 0.5s infinite alternate; }
        @keyframes fireBurn { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

        .anim-neon { font-family: 'Orbitron', sans-serif; font-size: 38px; animation: neonRGB 1.5s infinite linear; }
        @keyframes neonRGB { 0% { color: #ff0055; text-shadow: 0 0 20px #ff0055; } 50% { color: #00f0ff; text-shadow: 0 0 20px #00f0ff; } 100% { color: #ff0055; text-shadow: 0 0 20px #ff0055; } }

        .anim-bounce { font-family: 'Bangers', cursive; font-size: 42px; color: #ffea00; text-shadow: 3px 3px 0px #000; animation: bounceAnim 0.6s infinite alternate; }
        @keyframes bounceAnim { 0% { transform: translateY(0); } 100% { transform: translateY(-18px); } }
    </style>
</head>
<body>

    <!-- ട്രാൻസ്‌ലേറ്റർ (മലയാളം & ഇംഗ്ലീഷ് മാത്രം) -->
    <div class="lang-container">
        <select class="lang-select" id="langSelect" onchange="translateSite()">
            <option value="ml" selected>മലയാളം (Malayalam)</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- SECRET ADMIN BUTTON -->
    <div class="secret-ait" onclick="checkVisitorCount()">AIT</div>

    <div class="container">
        <h1 id="main-title">🎬 AI ടെക്സ്റ്റ് ആനിമേഷൻ വെബ്സൈറ്റ്</h1>
        
        <div class="studio-tabs">
            <button class="tab-btn active" id="tab-text" onclick="switchTab('text')">🎨 200 വെറൈറ്റി സ്റ്റൈലുകൾ</button>
            <button class="tab-btn" id="tab-anim" onclick="switchTab('anim')">🔥 ടെക്സ്റ്റ് ആനിമേഷൻ</button>
        </div>

        <input type="text" id="inputText" placeholder="ഇവിടെ നിന്റെ പേര് ടൈപ്പ് ചെയ്യൂ...">

        <!-- 1. STATIC 200 STYLES -->
        <div id="text-section">
            <div class="controls">
                <select id="styleSelect" onchange="updateStyle()">
                    <!-- Dropdown options -->
                </select>
                <button class="btn-download" id="btn-dl-1" onclick="downloadPNG()">📥 Transparent PNG</button>
            </div>
        </div>

        <!-- 2. ANIMATION STUDIO -->
        <div id="anim-section" style="display: none;">
            <div class="controls">
                <select id="animSelect" onchange="updateAnim()">
                    <option value="anim-fire" id="opt-fire">🔥 1. Fire Flame (തീ ആനിമേഷൻ)</option>
                    <option value="anim-neon" id="opt-neon">⚡ 2. Cyber Neon Pulse</option>
                    <option value="anim-bounce" id="opt-bounce">🏀 3. Pop Up Bounce</option>
                </select>
                <button class="btn-download" id="btn-dl-2" style="background: linear-gradient(45deg, #00e676, #00b0ff); color: black;" onclick="downloadPNG()">🎬 Frame PNG</button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="preview-area" id="previewBox">
            <div id="captureTarget" class="st-1">ഇവിടെ ടൈപ്പ് ചെയ്യൂ...</div>
        </div>
    </div>

    <script>
        let currentMode = 'text';

        // ---------------- REAL LIVE VISITOR COUNTER LOGIC ----------------
        function updateVisitorCount() {
            let count = localStorage.getItem('ait_site_visitors');
            if (!count) {
                count = 1000; // ഫസ്റ്റ് സ്റ്റാർട്ടിംഗ് വിസിറ്റർ നമ്പർ
            } else {
                count = parseInt(count) + 1; // പുതിയ ആളുകൾ കേറുമ്പോൾ 1 വീതം കൂടും
            }
            localStorage.setItem('ait_site_visitors', count);
        }
        updateVisitorCount();

        function checkVisitorCount() {
            let currentCount = localStorage.getItem('ait_site_visitors') || 1000;
            let code = prompt("ENTER SECRET CODE:");
            if (code === "AIT 2012") {
                alert("📊 Welcome Admin!\nTotal Visitor Count: " + currentCount);
            } else if(code !== null) {
                alert("❌ Wrong Secret Code!");
            }
        }

        // ---------------- STYLES DROPDOWN SETUP ----------------
        const styleNames = [
            "⛏️ Style 1: Minecraft Block Pixel",
            "🌐 Style 2: Cyber Neon Glow",
            "👑 Style 3: Royal Gold 3D",
            "💥 Style 4: Comic Pop Art",
            "👾 Style 5: Glitch Cyberpunk",
            "🧟 Style 6: Horror Blood Red",
            "🔥 Style 7: Lava Bungee Gradient",
            "💎 Style 8: Nabla 3D Crystal",
            "🌋 Style 9: Fire Burn Flame",
            "🩸 Style 10: Nosifer Dark Evil",
            "⚡ Style 11: Monoton Retro Lines",
            "🏛️ Style 12: Imperial Gold Luxury",
            "📟 Style 13: Hacker Matrix Green",
            "🖌️ Style 14: Marker Brush Yellow",
            "💖 Style 15: Pink Lobster Cursive",
            "🎮 Style 16: Gamer Orange Pop",
            "🌿 Style 17: Mint Green Fresh",
            "✨ Style 18: Pink Neon Glow",
            "🥷 Style 19: Samurai Red Ninja",
            "🛡️ Style 20: Titan Cyan Bold"
        ];

        const styleSelect = document.getElementById("styleSelect");
        for (let i = 1; i <= 200; i++) {
            let option = document.createElement("option");
            option.value = "st-" + i;
            if (i <= styleNames.length) {
                option.innerText = styleNames[i - 1];
            } else {
                option.innerText = "✨ Style " + i + ": Premium Variety " + i;
            }
            styleSelect.appendChild(option);
        }

        // ---------------- UI & LANGUAGE CONTROL ----------------
        function switchTab(mode) {
            currentMode = mode;
            if(mode === 'text') {
                document.getElementById('text-section').style.display = 'block';
                document.getElementById('anim-section').style.display = 'none';
                document.getElementById('tab-text').classList.add('active');
                document.getElementById('tab-anim').classList.remove('active');
                updateStyle();
            } else {
                document.getElementById('text-section').style.display = 'none';
                document.getElementById('anim-section').style.display = 'block';
                document.getElementById('tab-anim').classList.add('active');
                document.getElementById('tab-text').classList.remove('active');
                updateAnim();
            }
        }

        function updateStyle() {
            let defaultTxt = (document.getElementById("langSelect").value === 'ml') ? "ഇവിടെ ടൈപ്പ് ചെയ്യൂ..." : "Type Here...";
            let input = document.getElementById("inputText").value.trim() || defaultTxt;
            let target = document.getElementById("captureTarget");
            target.className = document.getElementById("styleSelect").value;
            target.innerText = input;
        }

        function updateAnim() {
            let defaultTxt = (document.getElementById("langSelect").value === 'ml') ? "ഇവിടെ ടൈപ്പ് ചെയ്യൂ..." : "Type Here...";
            let input = document.getElementById("inputText").value.trim() || defaultTxt;
            let target = document.getElementById("captureTarget");
            target.className = document.getElementById("animSelect").value;
            target.innerText = input;
        }

        document.getElementById("inputText").addEventListener("input", () => {
            if(currentMode === 'text') updateStyle();
            else updateAnim();
        });

        // ---------------- FULL TRANSLATION SYSTEM ----------------
        function translateSite() {
            let lang = document.getElementById("langSelect").value;
            let title = document.getElementById("main-title");
            let tabText = document.getElementById("tab-text");
            let tabAnim = document.getElementById("tab-anim");
            let input = document.getElementById("inputText");
            let btnDl1 = document.getElementById("btn-dl-1");
            let btnDl2 = document.getElementById("btn-dl-2");

            if(lang === 'ml') {
                title.innerText = "🎬 AI ടെക്സ്റ്റ് ആനിമേഷൻ വെബ്സൈറ്റ്";
                tabText.innerText = "🎨 200 വെറൈറ്റി സ്റ്റൈലുകൾ";
                tabAnim.innerText = "🔥 ടെക്സ്റ്റ് ആനിമേഷൻ";
                input.placeholder = "ഇവിടെ നിന്റെ പേര് ടൈപ്പ് ചെയ്യൂ...";
                btnDl1.innerText = "📥 Transparent PNG";
                btnDl2.innerText = "🎬 Frame PNG";
            } else {
                title.innerText = "🎬 AI Text Animation Website";
                tabText.innerText = "🎨 200 Variety Styles";
                tabAnim.innerText = "🔥 Text Animation";
                input.placeholder = "Type your text here...";
                btnDl1.innerText = "📥 Transparent PNG";
                btnDl2.innerText = "🎬 Frame PNG";
            }

            if(currentMode === 'text') updateStyle();
            else updateAnim();
        }

        // ---------------- TRANSPARENT PNG DOWNLOAD ----------------
        function downloadPNG() {
            let target = document.getElementById("captureTarget");
            let filename = document.getElementById("inputText").value.trim() || "ai_text_style";
            
            html2canvas(target, {
                backgroundColor: null,
                scale: 3
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = filename + '_transparent.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
