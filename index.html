<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Style Text to PNG King - Wide Edition</title>
    
    <!-- അൾട്ടിമേറ്റ് ഗൂഗിൾ ഫോണ്ടുകൾ -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Permanent+Marker&family=Bungee+Shade&family=Monoton&family=Creepster&family=Lobster&family=Orbitron:wght@700&family=Pacifico&family=Righteous&family=Rubik+Glitch&family=Russo+One&family=Special+Elite&family=Alfa+Slab+One&family=Cinzel:wght@700&family=Comfortaa:wght@700&family=Eater&family=Fascinate+Inline&family=Fredericka+the+Great&family=Faster+One&family=Gugi&family=Iceberg&family=Kelly+Slab&family=Lacquer&family=Nosifer&family=Oi&family=Piedra&family=Sacramento&family=Shojumaru&family=Silkscreen&family=Smokum&family=Stalinist+One&family=Syncopate:wght@700&family=Wallpoet&display=swap" rel="stylesheet">
    
    <!-- HTML-നെ HD ചിത്രമാക്കുന്ന ലൈബ്രറി -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #07070a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { background: #0f0f16; border-radius: 24px; padding: 30px; width: 100%; max-width: 900px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); text-align: center; border: 1px solid #1f1f2e; }
        h1 { font-size: 26px; margin-bottom: 25px; color: #00ffaa; text-shadow: 0 0 15px rgba(0,255,170,0.4); font-weight: 800; }
        
        input[type="text"] { width: 100%; background: #161622; border: 2px solid #252536; border-radius: 12px; color: #fff; padding: 18px; font-size: 22px; outline: none; transition: 0.3s; text-align: center; font-weight: bold; }
        input[type="text"]:focus { border-color: #00ffaa; box-shadow: 0 0 15px rgba(0,255,170,0.2); }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        select, button { background: #161622; color: #fff; border: 2px solid #252536; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; outline: none; font-weight: bold; width: 100%; transition: 0.2s; }
        select:focus, button:hover { border-color: #00ffaa; background: #1d1d2b; }
        
        button.btn-download { background: #00ffaa; color: #07070a; border: none; font-size: 18px; box-shadow: 0 5px 20px rgba(0,255,170,0.4); }
        button.btn-download:hover { background: #00e699; transform: translateY(-2px); }
        button.btn-download:active { transform: translateY(0); }

        /* 🔴 പ്രധാന മാറ്റം: നീളമുള്ള പേര് താഴേക്ക് പോകാതിരിക്കാൻ വീതിയുള്ള പ്രിവ്യൂ വിൻഡോ */
        .preview-area { background: #040406; border: 2px dashed #252536; border-radius: 18px; min-height: 220px; display: flex; justify-content: center; align-items: center; padding: 20px; margin-top: 20px; overflow-x: auto; width: 100%; }
        
        /* 🔴 അക്ഷരങ്ങൾ വരി മുറിഞ്ഞു പോകാതിരിക്കാൻ white-space: nowrap സെറ്റ് ചെയ്തു */
        #captureTarget { padding: 25px 40px; background: transparent; display: inline-block; text-align: center; white-space: nowrap; max-width: none; }

        /* ================= 60+ WORLD CLASS MEGA STYLES ================= */
        .st-minecraft { font-family: 'Press Start 2P', monospace; font-size: 24px; color: #55FF55; text-shadow: 4px 4px 0px #000; letter-spacing: 2px; }
        .st-retro-8bit { font-family: 'Silkscreen', sans-serif; font-size: 36px; color: #ff00ff; text-shadow: 3px 3px 0px #ffff00; font-weight: bold; }
        .st-arcade { font-family: 'Press Start 2P', monospace; font-size: 22px; color: #ffff00; text-shadow: -3px -3px 0 #ff0000, 3px 3px 0 #00ffff; }
        .st-cyber-hacker { font-family: 'Wallpoet', cursive; font-size: 34px; color: #00ff00; text-shadow: 0 0 10px #00ff00, 0 0 20px #005500; }
        .st-neon-pink { font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055; }
        .st-neon-blue { font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 40px #00d2ff; }
        .st-neon-green { font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 40px #1b8a07; }
        .st-neon-yellow { font-family: 'Righteous', cursive; font-size: 38px; color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffaa00; }
        .st-cyberpunk { font-family: 'Russo One', sans-serif; font-size: 40px; color: #ffff00; text-shadow: 4px 4px 0px #ff007f; letter-spacing: 2px; }
        .st-glitch { font-family: 'Rubik Glitch', cursive; font-size: 42px; color: #fff; text-shadow: 3px -3px #ff0055, -3px 3px #00f0ff; }
        .st-future-mech { font-family: 'Orbitron', sans-serif; font-size: 36px; color: #a4b0be; text-shadow: 2px 2px 0px #2f3542; -webkit-text-stroke: 1px #fff; }
        .st-sci-line { font-family: 'Syncopate', sans-serif; font-size: 32px; color: #00f0ff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,240,255,0.5); }
        .st-horror-blood { font-family: 'Creepster', cursive; font-size: 46px; color: #ff2222; text-shadow: 3px 3px 5px #000; letter-spacing: 4px; }
        .st-melting-acid { font-family: 'Nosifer', cursive; font-size: 32px; color: #39ff14; text-shadow: 3px 3px 0px #000; }
        .st-ghostly { font-family: 'Eater', cursive; font-size: 36px; color: #dfe4ea; text-shadow: 0 0 15px rgba(255,255,255,0.6); }
        .st-gold-3d { font-family: 'Russo One', sans-serif; font-size: 40px; color: #ffd700; text-shadow: 1px 1px 0px #b59410, 2px 2px 0px #91750c, 4px 4px 6px rgba(0,0,0,0.6); }
        .st-silver { font-family: 'Russo One', sans-serif; font-size: 40px; color: #f1f2f6; text-shadow: 1px 1px 0px #ced6e0, 2px 2px 0px #a4b0be, 4px 4px 6px rgba(0,0,0,0.5); }
        .st-fire-flame { font-family: 'Russo One', sans-serif; font-size: 38px; color: #fff; text-shadow: 0 -3px 6px #ff3300, 0 -6px 12px #ff9900, 0 -12px 25px #ffcc00; }
        .st-ice-cube { font-family: 'Iceberg', cursive; font-size: 40px; color: #dff9fb; text-shadow: 0 0 8px #7ed6df; }
        .st-comic-boom { font-family: 'Alfa Slab One', cursive; font-size: 42px; color: #ffeb3b; -webkit-text-stroke: 2px #000; text-shadow: 5px 5px 0px #000; }
        .st-graffiti-art { font-family: 'Permanent Marker', cursive; font-size: 42px; color: #ff007f; text-shadow: 4px 4px 0px #fff, 7px 7px 0px #000; }
        .st-candy-pop { font-family: 'Lobster', cursive; font-size: 40px; color: #ff4081; text-shadow: 3px 3px 0px #fff, 5px 5px 0px #ff80ab; }
        .st-fat-bubble { font-family: 'Oi', cursive; font-size: 36px; color: #00eaff; text-shadow: 4px 4px 0px #0044ff; -webkit-text-stroke: 1px #000; }
        .st-vintage-type { font-family: 'Special Elite', cursive; font-size: 32px; color: #f5f6fa; text-shadow: 2px 2px 0px #718093; }
        .st-royal-gold { font-family: 'Cinzel', serif; font-size: 36px; color: #d4af37; letter-spacing: 4px; }
        .st-luxury-gradient { font-family: 'Righteous', cursive; font-size: 40px; background: linear-gradient(45deg, #ff0055, #7000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .st-smooth-signature { font-family: 'Pacifico', cursive; font-size: 38px; color: #7bed9f; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .st-rainbow { font-family: 'Russo One', sans-serif; font-size: 40px; color: #ff007f; animation: rainbowShift 4s infinite linear; }
        .st-monoton-lines { font-family: 'Monoton', cursive; font-size: 44px; color: #e040fb; }
        .st-bungee-stripe { font-family: 'Bungee Shade', cursive; font-size: 38px; color: #ff6b81; }
        .st-glitch-ink { font-family: 'Lacquer', cursive; font-size: 40px; color: #ffa502; text-shadow: 2px 2px 0px #000; }
        .st-mega-shadow { font-family: 'Russo One', sans-serif; font-size: 40px; color: #fff; text-shadow: 0 1px 0 #ccc, 0 2px 0 #c5c5c5, 0 3px 0 #bbb, 0 4px 0 #b0b0b0, 0 8px 10px rgba(0,0,0,.4); }
        .st-cyber-hologram { font-family: 'Gugi', cursive; font-size: 38px; color: rgba(0,255,255,0.8); text-shadow: 0 0 10px rgba(0,255,255,0.8), 2px 2px 0px rgba(255,0,255,0.6); }
        .st-ninja-scroll { font-family: 'Shojumaru', cursive; font-size: 34px; color: #ff3838; text-shadow: 2px 2px 0px #000; }
        .st-speed-racer { font-family: 'Faster One', cursive; font-size: 44px; color: #f1c40f; text-shadow: 3px 3px 0px #e67e22; }
        .st-cute-bubble { font-family: 'Comfortaa', cursive; font-size: 36px; color: #ff781f; text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffeaa7; font-weight: 900; }
        .st-military { font-family: 'Stalinist One', cursive; font-size: 28px; color: #78e08f; text-shadow: 3px 3px 0px #1e3799; }

        @keyframes rainbowShift {
            0% { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
            50% { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
            100% { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌍 World Style Text to PNG King</h1>
        
        <!-- ഡിഫോൾട്ട് ആയി വലിയ വാക്ക് നൽകിയിരിക്കുന്നു -->
        <input type="text" id="inputText" placeholder="ഇവിടെ ടൈപ്പ് ചെയ്യൂ..." value="MinecraftHomework">
        
        <div class="controls">
            <select id="styleSelect" onchange="updateStyle()">
                <optgroup label="🎮 GAMING & RETRO">
                    <option value="st-minecraft" selected>🟩 Minecraft 3D Block</option>
                    <option value="st-retro-8bit">👾 8-Bit Cyber Retro</option>
                    <option value="st-arcade">🕹️ 90s Arcade Champion</option>
                    <option value="st-cyber-hacker">📟 Cyber Hacker Terminal</option>
                </optgroup>
                <optgroup label="✨ NEON GLOW EFFECTS">
                    <option value="st-neon-pink">💗 Ultra Neon Pink</option>
                    <option value="st-neon-blue">💙 Electric Neon Blue</option>
                    <option value="st-neon-green">💚 Toxic Neon Green</option>
                    <option value="st-neon-yellow">💛 Radioactive Yellow</option>
                    <option value="st-cyber-hologram">🌐 Sci-Fi Cyber Hologram</option>
                </optgroup>
                <optgroup label="🚀 FUTURE & CYBERPUNK">
                    <option value="st-cyberpunk">🤖 Cyberpunk 2077 Vibe</option>
                    <option value="st-glitch">📺 Digital Glitch Screen</option>
                    <option value="st-future-mech">⚙️ Heavy Armor Mech</option>
                    <option value="st-sci-line">📡 Minimal Space Radar</option>
                </optgroup>
                <optgroup label="🔥 PREMIUM METALLIC & NATURE">
                    <option value="st-gold-3d">👑 24K Luxury Gold 3D</option>
                    <option value="st-silver">🥈 Pure Heavy Silver</option>
                    <option value="st-fire-flame">🔥 Blazing Fire Inferno</option>
                    <option value="st-ice-cube">❄️ Frozen Arctic Ice</option>
                    <option value="st-stone-age">🪨 Prehistoric Stone Carve</option>
                    <option value="st-wooden-block">🪵 Wild West Wood Text</option>
                </optgroup>
                <optgroup label="🎨 CARTOON, ART & COMIC">
                    <option value="st-comic-boom">💥 Marvel Comic POP</option>
                    <option value="st-graffiti-art">🖌️ Street Graffiti Wall</option>
                    <option value="st-candy-pop">🍭 Sweet Candy Cream</option>
                    <option value="st-fat-bubble">🎈 Oi Bold Bubble</option>
                    <option value="st-cute-bubble">🧡 Pastel Cute Rounded</option>
                </optgroup>
                <optgroup label="🧛 HORROR & DARK METAL">
                    <option value="st-horror-blood">🩸 Vampire Blood Dripping</option>
                    <option value="st-melting-acid">☣️ Toxic Acid Melt</option>
                    <option value="st-ghostly">👻 Haunted Ghost Shadow</option>
                </optgroup>
                <optgroup label="📜 VINTAGE, LUXURY & SPECIAL">
                    <option value="st-vintage-type">📰 Old Typewriter Ink</option>
                    <option value="st-royal-gold">🏛️ Imperial Roman Elite</option>
                    <option value="st-luxury-gradient">🌈 Spectrum Neon Gradient</option>
                    <option value="st-smooth-signature">🍃 Calm Wave Cursive</option>
                    <option value="st-rainbow">🏳️‍🌈 Dynamic Color Shifter</option>
                    <option value="st-monoton-lines">🏁 Monoton Parallel Lines</option>
                    <option value="st-bungee-stripe">🦓 Zebra Vertical Stripe</option>
                    <option value="st-glitch-ink">🎨 Lacquer Wet Splash</option>
                    <option value="st-ninja-scroll">🏮 Anime Ninja Scroll</option>
                    <option value="st-speed-racer">🏎️ Nitro Speed Racer</option>
                    <option value="st-military">🪖 Commando Army Metal</option>
                </optgroup>
            </select>
            <button class="btn-download" onclick="downloadPNG()">📥 Save transparent PNG</button>
        </div>
        
        <div class="preview-area">
            <div id="captureTarget" class="st-minecraft">MinecraftHomework</div>
        </div>
    </div>

    <script>
        function updateStyle() {
            let input = document.getElementById("inputText").value;
            let target = document.getElementById("captureTarget");
            let selectedStyle = document.getElementById("styleSelect").value;
            
            if (input.trim() === "") {
                target.innerText = "Type Here...";
                return;
            }
            
            target.className = ""; 
            target.classList.add(selectedStyle);
            target.innerText = input;

            // 🔴 അക്ഷരങ്ങളുടെ എണ്ണം കൂടുന്നതിനനുസരിച്ച് ഫോണ്ട് സൈസ് തനിയെ അഡ്ജസ്റ്റ് ചെയ്യാനുള്ള ലോജിക്
            let len = input.length;
            if (selectedStyle !== "st-minecraft") { // Minecraft ഒഴികെയുള്ളവയ്ക്ക്
                if (len > 15) {
                    target.style.fontSize = "24px";
                } else if (len > 10) {
                    target.style.fontSize = "30px";
                } else {
                    target.style.fontSize = ""; // ഡിഫോൾട്ട് സിഎസ്എസ് സൈസ്
                }
            } else {
                if (len > 15) {
                    target.style.fontSize = "16px";
                } else if (len > 10) {
                    target.style.fontSize = "20px";
                } else {
                    target.style.fontSize = "";
                }
            }
        }

        document.getElementById("inputText").addEventListener("input", updateStyle);

        function downloadPNG() {
            let target = document.getElementById("captureTarget");
            let fileName = document.getElementById("inputText").value.trim() || "text";
            
            html2canvas(target, {
                backgroundColor: null, 
                scale: 4,             
                logging: false,
                useCORS: true         
            }).then(canvas => {
                let image = canvas.toDataURL("image/png");
                let link = document.createElement('a');
                link.download = fileName + '_wide_style.png';
                link.href = image;
                link.click();
            });
        }
        
        updateStyle();
    </script>
</body>
</html>
